<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Edusphere Book Club — pick up to three new books each month, delivered in a box made for opening." />
    <meta name="theme-color" content="#c6b4ff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Caveat:wght@500..700&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet" />
    <title>Log in — Edusphere Book Club</title>
  </head>
  <body>
    <div data-barba="wrapper">
      <main data-barba="container" data-barba-namespace="login">

        <section class="login">
          <div class="login__card" data-scatter>
            <div class="login__sheet" data-scatter-item data-tilt="-2">
              <p class="t-hand" data-hand>welcome back, bookworm</p>
              <h1 class="t-h2" data-split="lines" data-intro>Log in or join</h1>
              <form class="login__form" data-login novalidate>
                <label>Email<input name="email" type="email" autocomplete="email" required /></label>
                <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
                <button class="btn" type="submit"><span class="btn__label">Continue</span><span class="btn__icon"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 8h11M9 3.5 13.5 8 9 12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
                <p class="login__status" data-login-status aria-live="polite"></p>
              </form>
            </div>
          </div>
        </section>
        <div data-footer-slot></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
